# Energy Epoch — Cloudflare Worker (static assets today; /api for auth later).
# Serves the built Vite SPA from dist/. Deployed via `wrangler deploy`
# (GitHub Actions, matching the jforgelabs pattern) or locally.
name = "energy-epoch"
account_id = "0d3499a5956d3f2f19daf0b351a6b36f"
compatibility_date = "2026-07-01"
# Keep the *.workers.dev URL as a staging/testing address alongside the domain.
workers_dev = true

# Custom domain — provisions the DNS record + TLS cert on the zone (already in
# this account) on deploy. The Worker is already live, so this just attaches
# the domain. If it errors on an existing root DNS record, clear that record
# (or add the domain via the dashboard) and redeploy.
routes = [
  { pattern = "playenergyepoch.com", custom_domain = true },
]

# The Worker runs first on every request and serves static assets via ASSETS
# for anything that isn't /api (magic-link auth + cloud saves).
main = "worker/index.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Single-page app: serve index.html for any unmatched path.
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
APP_URL = "https://playenergyepoch.com"
# Must equal the Resend-verified domain (confirmed: playenergyepoch.com).
FROM_EMAIL = "landman@playenergyepoch.com"
# Secret (set out-of-band, never committed): RESEND_API_KEY
#   npx wrangler secret put RESEND_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "energy-epoch-db"
database_id = "2f48a82f-1999-418f-bfc9-9f85ddfd82c9"

[[r2_buckets]]
binding = "SAVES"
bucket_name = "energy-epoch-saves"
