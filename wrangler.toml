# Energy Epoch — Cloudflare Worker (static assets today; /api for auth later).
# Serves the built Vite SPA from dist/. Deployed via `wrangler deploy`
# (GitHub Actions, matching the jforgelabs pattern) or locally.
name = "energy-epoch"
account_id = "0d3499a5956d3f2f19daf0b351a6b36f"
compatibility_date = "2026-07-01"
# Keep the *.workers.dev URL as a staging/testing address alongside the domain.
workers_dev = true

# Custom domain — provisions the DNS record + TLS cert on the zone (already in
# this account) on deploy. The Worker is already live, so this just attaches
# the domain. If it errors on an existing root DNS record, clear that record
# (or add the domain via the dashboard) and redeploy.
routes = [
  { pattern = "playenergyepoch.com", custom_domain = true },
]

[assets]
directory = "./dist"
# Single-page app: serve index.html for any unmatched path (and future client
# routes / the auth callback page) instead of a 404.
not_found_handling = "single-page-application"

