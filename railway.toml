# Energy Epoch — static SPA on Railway (Path W)
# Railpack detects Vite and serves dist/ with Caddy (no app server / no game compute).
# base path must stay "/" (Railway root domain). Do not set Vite base to /energy-epoch/.

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
