name: Deploy (Cloudflare Workers)

# Production deploy: builds the Vite SPA and publishes the Worker (dist/ static
# assets) to Cloudflare on every push to `main`. `main` is the production
# branch — work on feature branches and MERGE to main to ship.
#
# One repo secret required:
#   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit + Account:Read + Zone:DNS:Edit)
# The account ID is read from wrangler.toml, so no second secret is needed.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wrangler 4 requires Node >= 22; Node 20 forces an install of Wrangler 3
          # which ignores assets.run_worker_first and can serve the SPA on apex /.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Use the repo's wrangler (v4) — do not let the action install an older CLI.
          package: wrangler@4.114.0
